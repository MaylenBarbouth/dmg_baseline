# config/experiment_config.yaml
project_name: "baseline_dmg_doctorado"

paths:
  raw_data: "data/raw/dataset_dmg_con_fecha.csv"
  processed_dir: "data/processed"
  outputs_dir: "outputs"
  optuna_db: "sqlite:///outputs/optuna_db/studies.db"

schema:
  pregnancy_id: "id_embarazo"
  patient_id: "id_paciente"
  target_col: "DMG"
  date_col: "fecha_1T"

# Definición exacta de variables según el perfilado de la base (45 + fecha_1T)
columns:
  obstetric_zero_impute:
    - "PARTOS"
    - "CESAREAS"
    - "ABORTOS"
  obstetric_one_impute:
    - "GRAVIDA"
  
  high_null_drop_in_logreg:
    - "IMC"
    - "TALLA"

  # Escalera de Ablación
