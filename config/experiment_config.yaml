validation:
  cv_n_splits: 5
  cv_n_repeats: 5
  cv_base_seed: 1000
  temporal_train_quantile: 0.80
  temporal_n_seeds: 10
  temporal_base_seed: 2000
  inner_cv_splits: 3

optimization:
  n_trials: 100
  n_jobs_per_model: 18        # Ajustar a 12 o 16 según los cores de la PC
  boundary_tolerance: 0.05    # 5% del rango inferior o superior activa el flag de borde
